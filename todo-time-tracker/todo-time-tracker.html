<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskTime — To-Do Time Tracker</title>
<style>
  :root{
    --bg1:#0f1220; --bg2:#1a1030;
    --card:#181c2e; --card2:#1f2438;
    --line:#2c3350;
    --text:#e8eaf6; --muted:#8b93b8;
    --accent:#7c6cff; --accent2:#4fd1c5;
    --danger:#ff6b81;
    --ok:#5eead4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 800px at 80% -10%,var(--bg2),var(--bg1) 60%);
    min-height:100vh;color:var(--text);padding:40px 16px;
  }
  .app{max-width:680px;margin:0 auto}
  header{margin-bottom:24px}
  h1{font-size:30px;letter-spacing:.5px}
  h1 .logo{color:var(--accent)}
  .sub{color:var(--muted);margin-top:4px;font-size:14px}

  .addbar{display:flex;gap:10px;margin-bottom:18px}
  #task-input{
    flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;
    color:var(--text);padding:13px 16px;font-size:15px;outline:none;transition:border-color .15s;
  }
  #task-input:focus{border-color:var(--accent)}
  #task-input::placeholder{color:var(--muted)}
  #add-btn{
    background:linear-gradient(135deg,var(--accent),#5a8bff);color:#fff;border:none;
    border-radius:12px;padding:0 22px;font-size:15px;font-weight:600;cursor:pointer;
    transition:transform .1s,filter .15s;
  }
  #add-btn:hover{filter:brightness(1.12)}
  #add-btn:active{transform:scale(.96)}

  .stats{display:flex;gap:10px;margin-bottom:16px}
  .stat{
    flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;text-align:center;
  }
  .stat span{display:block;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
  .stat label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  #stat-total{color:var(--accent2)}

  .filters{display:flex;gap:8px;margin-bottom:14px;align-items:center}
  .filters button{
    background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;transition:all .15s;
  }
  .filters button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .filters button:hover:not(.on){color:var(--text);border-color:var(--muted)}
  #clear-done{margin-left:auto;border-style:dashed}
  #clear-done:hover{color:var(--danger);border-color:var(--danger)}

  ul{list-style:none;display:flex;flex-direction:column;gap:10px}
  .task{
    display:flex;align-items:center;gap:12px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:13px 15px;transition:border-color .15s,opacity .2s;
  }
  .task.running{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 6px 24px -12px var(--accent)}
  .task.done{opacity:.55}
  .task.done .tname{text-decoration:line-through;color:var(--muted)}
  .chk{
    appearance:none;width:20px;height:20px;min-width:20px;border:2px solid var(--muted);
    border-radius:6px;cursor:pointer;position:relative;background:transparent;
  }
  .chk:checked{background:var(--accent2);border-color:var(--accent2)}
  .chk:checked::after{
    content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#06251f;font-weight:800;font-size:13px;
  }
  .tname{flex:1;font-size:15px;word-break:break-word}
  .tname .dot{
    display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);
    margin-right:8px;animation:pulse 1.2s ease-in-out infinite;vertical-align:middle;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .ttime{
    font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;color:var(--accent2);
    min-width:78px;text-align:right;
  }
  .toggle{
    border:1px solid var(--accent);background:transparent;color:var(--accent);
    border-radius:9px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;
    min-width:70px;transition:all .15s;
  }
  .toggle.stop{background:var(--accent);color:#fff}
  .toggle:hover{filter:brightness(1.15)}
  .del{
    background:transparent;border:none;color:var(--muted);font-size:16px;cursor:pointer;
    padding:6px;border-radius:8px;line-height:1;
  }
  .del:hover{color:var(--danger);background:rgba(255,107,129,.1)}

  .empty{color:var(--muted);text-align:center;padding:34px 0;font-size:14px}
  footer{margin-top:22px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><span class="logo">⏱</span> TaskTime</h1>
    <p class="sub">Your to-do list, with a clock.</p>
  </header>

  <div class="addbar">
    <input id="task-input" placeholder="What are you working on?" maxlength="120" autocomplete="off">
    <button id="add-btn">Add</button>
  </div>

  <div class="stats">
    <div class="stat"><span id="stat-active">0</span><label>Active</label></div>
    <div class="stat"><span id="stat-done">0</span><label>Done</label></div>
    <div class="stat"><span id="stat-total">0:00:00</span><label>Total tracked</label></div>
  </div>

  <div class="filters">
    <button data-filter="all" class="on">All</button>
    <button data-filter="active">Active</button>
    <button data-filter="done">Done</button>
    <button id="clear-done">Clear done</button>
  </div>

  <ul id="task-list"></ul>
  <p class="empty" id="empty-msg">No tasks yet — add one above.</p>

  <footer>Saved automatically in this browser · Only one timer runs at a time</footer>
</div>

<script>
(function(){
  const KEY='tasktim…s.v1';
  let tasks=load();
  let filter='all';

  const listEl=document.getElementById('task-list');
  const emptyEl=document.getElementById('empty-msg');
  const input=document.getElementById('task-input');

  function load(){
    try{const d=JSON.parse(localStorage.getItem(KEY));return Array.isArray(d)?d:[]}
    catch(e){return[]}
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}
  function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function fmt(ms){
    ms=Math.max(0,Math.floor(ms/1000));
    const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),s=ms%60;
    return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }
  function elapsed(t){return t.elapsed+(t.startedAt?Date.now()-t.startedAt:0)}
  function byId(id){return tasks.find(t=>t.id===id)}

  function stopAll(){
    tasks.forEach(t=>{if(t.startedAt){t.elapsed+=Date.now()-t.startedAt;t.startedAt=null}});
  }

  function render(){
    const shown=tasks.filter(t=>
      filter==='all'?true:filter==='done'?t.done:!t.done);
    listEl.innerHTML=shown.map(t=>`
      <li class="task${t.done?' done':''}${t.startedAt?' running':''}" data-id="${t.id}">
        <input type="checkbox" class="chk" ${t.done?'checked':''} title="Mark done">
        <div class="tname">${t.startedAt?'<span class="dot"></span>':''}${esc(t.name)}</div>
        <div class="ttime">${fmt(elapsed(t))}</div>
        <button class="toggle${t.startedAt?' stop':''}" ${t.done?'disabled style="opacity:.4"':''}>${t.startedAt?'Stop':'Start'}</button>
        <button class="del" title="Delete">✕</button>
      </li>`).join('');
    emptyEl.style.display=shown.length?'none':'block';
    emptyEl.textContent=tasks.length?'Nothing here with this filter.':'No tasks yet — add one above.';
    updateStats();
  }

  function updateStats(){
    document.getElementById('stat-active').textContent=tasks.filter(t=>!t.done).length;
    document.getElementById('stat-done').textContent=tasks.filter(t=>t.done).length;
    document.getElementById('stat-total').textContent=fmt(tasks.reduce((a,t)=>a+elapsed(t),0));
  }

  // live tick
  setInterval(()=>{
    listEl.querySelectorAll('.task').forEach(li=>{
      const t=byId(li.dataset.id);
      if(t)li.querySelector('.ttime').textContent=fmt(elapsed(t));
    });
    updateStats();
  },500);

  // add task
  function addTask(){
    const name=input.value.trim();
    if(!name)return;
    tasks.unshift({id:String(Date.now())+Math.random().toString(36).slice(2,6),
      name,done:false,elapsed:0,startedAt:null});
    input.value='';
    save();render();input.focus();
  }
  document.getElementById('add-btn').addEventListener('click',addTask);
  input.addEventListener('keydown',e=>{if(e.key==='Enter')addTask()});

  // task actions (event delegation)
  listEl.addEventListener('click',e=>{
    const li=e.target.closest('.task');if(!li)return;
    const t=byId(li.dataset.id);if(!t)return;
    if(e.target.classList.contains('toggle')&&!t.done){
      if(t.startedAt){t.elapsed+=Date.now()-t.startedAt;t.startedAt=null;}
      else{stopAll();t.startedAt=Date.now();}
      save();render();
    }else if(e.target.classList.contains('del')){
      tasks=tasks.filter(x=>x.id!==t.id);save();render();
    }
  });
  listEl.addEventListener('change',e=>{
    if(!e.target.classList.contains('chk'))return;
    const li=e.target.closest('.task');const t=byId(li.dataset.id);if(!t)return;
    t.done=e.target.checked;
    if(t.done&&t.startedAt){t.elapsed+=Date.now()-t.startedAt;t.startedAt=null;}
    save();render();
  });

  // filters
  document.querySelectorAll('[data-filter]').forEach(b=>{
    b.addEventListener('click',()=>{
      filter=b.dataset.filter;
      document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('on',x===b));
      render();
    });
  });
  document.getElementById('clear-done').addEventListener('click',()=>{
    tasks=tasks.filter(t=>!t.done);save();render();
  });

  render();
})();
</script>
</body>
</html>
