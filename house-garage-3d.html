<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D House with Garage</title>
<style>
  html, body { margin: 0; padding: 0; background: #0e1420; overflow: hidden; font-family: system-ui, sans-serif; }
  #app { position: relative; width: 100%; height: 660px; }
  canvas { display: block; }
  #ui {
    position: absolute; top: 14px; left: 14px; z-index: 10;
    background: rgba(14, 20, 32, 0.72); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 12px;
    padding: 12px 14px; color: #eef2f8; user-select: none;
  }
  #ui h1 { font-size: 15px; margin: 0 0 2px; font-weight: 650; }
  #ui p { font-size: 11.5px; margin: 0 0 10px; color: #9fb0c8; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 12px; color: #eef2f8; cursor: pointer;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px; padding: 6px 11px; transition: background .15s;
  }
  button:hover { background: rgba(255,255,255,0.18); }
  button.on { background: #3b82f6; border-color: #3b82f6; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="app">
  <div id="ui">
    <h1>🏠 3D House with Garage</h1>
    <p>Drag to orbit &nbsp;·&nbsp; Scroll to zoom &nbsp;·&nbsp; Right-drag to pan</p>
    <div class="btns">
      <button id="btnRotate" class="on">Auto-rotate</button>
      <button id="btnNight">🌙 Night</button>
      <button id="btnReset">Reset view</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 300);
const HOME_POS = new THREE.Vector3(15, 10.5, 19);
const HOME_TGT = new THREE.Vector3(0.5, 2.2, -1.5);
camera.position.copy(HOME_POS);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME_TGT);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 6;
controls.maxDistance = 70;
controls.maxPolarAngle = Math.PI / 2.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;

// ---------- lights ----------
const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x6a5a44, 0.85);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(18, 26, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -25; sun.shadow.camera.right = 25;
sun.shadow.camera.top = 25; sun.shadow.camera.bottom = -25;
sun.shadow.camera.far = 80;
sun.shadow.bias = -0.0004;
scene.add(sun);
const porchLight = new THREE.PointLight(0xffc27a, 0, 8, 2);
porchLight.position.set(-2.1, 2.9, 0.6);
scene.add(porchLight);

// ---------- helpers ----------
const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: o.r ?? 0.85, metalness: o.m ?? 0.05, ...o.extra });
function box(w, h, d, material, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  scene.add(m); return m;
}
function gableRoof(w, h, d, material, x, y, z) {
  const shape = new THREE.Shape();
  shape.moveTo(-w / 2, 0); shape.lineTo(w / 2, 0); shape.lineTo(0, h); shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth: d, bevelEnabled: false });
  geo.translate(0, 0, -d / 2);
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  scene.add(m); return m;
}
function tree(x, z, s = 1) {
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.22 * s, 0.3 * s, 1.4 * s, 8), mat(0x7a5230));
  trunk.position.set(x, 0.7 * s, z); trunk.castShadow = true; scene.add(trunk);
  const leafM = mat(0x2f7d3a);
  [[1.9, 2.0, 2.3], [1.4, 2.9, 1.7], [0.9, 3.7, 1.2]].forEach(([r, y, hh]) => {
    const c = new THREE.Mesh(new THREE.ConeGeometry(r * s, hh * s, 9), leafM);
    c.position.set(x, y * s, z); c.castShadow = true; scene.add(c);
  });
}
function bush(x, z, s = 1) {
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.5 * s, 12, 10), mat(0x3c8a4d));
  b.position.set(x, 0.38 * s, z); b.scale.y = 0.8; b.castShadow = true; b.receiveShadow = true; scene.add(b);
}

// ---------- materials ----------
const wallM   = mat(0xf2e3c2);
const trimM   = mat(0xffffff);
const roofM   = mat(0x4b4e5e, { r: 0.7 });
const doorM   = mat(0x7a4a28, { r: 0.6 });
const glassM  = new THREE.MeshStandardMaterial({ color: 0x9fd4f0, roughness: 0.15, metalness: 0.4, emissive: 0x000000 });
const garageM = new THREE.MeshStandardMaterial({ color: 0xe9e9ee, roughness: 0.5, metalness: 0.25 });
const concreteM = mat(0xb9bcc2, { r: 0.95 });
const pathM = mat(0xc9b99a, { r: 0.95 });

const glowWindows = [];
function windowPane(w, h, x, y, z, ry = 0) {
  const frame = box(w + 0.22, h + 0.22, 0.12, trimM, x, y, z); frame.rotation.y = ry;
  const glass = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.16), glassM.clone());
  glass.position.set(x, y, z); glass.rotation.y = ry;
  const off = new THREE.Vector3(0, 0, 0.05).applyAxisAngle(new THREE.Vector3(0, 1, 0), ry);
  glass.position.add(off);
  glass.userData.isGlass = true;
  scene.add(glass); glowWindows.push(glass);
  const bar = box(0.06, h, 0.18, trimM, x + off.x, y, z + off.z); bar.rotation.y = ry;
  return glass;
}

// ---------- ground ----------
const ground = new THREE.Mesh(new THREE.CircleGeometry(45, 48), mat(0x6fae5e, { r: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// ---------- main house (front faces +Z) ----------
box(8, 4, 6, wallM, -2, 2, -3);                       // body
gableRoof(8.9, 2.6, 6.8, roofM, -2, 4, -3);           // roof
box(8.2, 0.25, 6.2, trimM, -2, 4.02, -3);             // fascia band
box(0.8, 2.6, 0.8, mat(0x8f4a3a), -4.6, 5.6, -4.2);   // chimney
box(1.0, 0.25, 1.0, mat(0x6e3a2e), -4.6, 6.95, -4.2); // chimney cap

// front door + step
box(1.35, 2.55, 0.16, doorM, -3, 1.28, 0.06);
box(0.1, 0.1, 0.1, mat(0xd9b23a, { m: 0.8, r: 0.3 }), -2.45, 1.25, 0.16); // knob
box(1.9, 0.18, 0.9, concreteM, -3, 0.09, 0.55);       // step
const porchLamp = new THREE.Mesh(new THREE.SphereGeometry(0.14, 10, 10),
  new THREE.MeshStandardMaterial({ color: 0xfff2cc, emissive: 0x000000 }));
porchLamp.position.set(-2.1, 2.75, 0.18); scene.add(porchLamp);

// front windows
windowPane(1.3, 1.3, -0.9, 2.35, 0.06);
windowPane(1.3, 1.3, -5.1, 2.35, 0.06);
// side windows (left wall x=-6)
windowPane(1.2, 1.2, -6.06, 2.35, -1.6, -Math.PI / 2);
windowPane(1.2, 1.2, -6.06, 2.35, -4.4, -Math.PI / 2);
// back windows
windowPane(1.2, 1.2, -3.2, 2.35, -6.06, Math.PI);
windowPane(1.2, 1.2, -0.8, 2.35, -6.06, Math.PI);
// attic round window on front gable
const attic = new THREE.Mesh(new THREE.CircleGeometry(0.52, 24), glassM.clone());
attic.position.set(-2, 5.15, 0.42); attic.userData.isGlass = true;
scene.add(attic); glowWindows.push(attic);
const atticRing = new THREE.Mesh(new THREE.TorusGeometry(0.58, 0.07, 10, 28), trimM);
atticRing.position.set(-2, 5.15, 0.4); scene.add(atticRing);

// ---------- garage (attached right) ----------
box(5, 3.3, 5.5, wallM, 4.5, 1.65, -2.75);
gableRoof(5.8, 1.8, 6.3, roofM, 4.5, 3.3, -2.75);
box(5.2, 0.22, 5.7, trimM, 4.5, 3.32, -2.75);
// garage door
box(4.1, 2.85, 0.16, garageM, 4.5, 1.43, 0.07);
for (let i = 0; i < 4; i++) box(3.95, 0.07, 0.05, mat(0x9aa0aa), 4.5, 0.55 + i * 0.62, 0.17);
box(4.3, 0.18, 0.3, trimM, 4.5, 2.92, 0.08);          // door header
windowPane(1.0, 1.0, 7.06, 1.9, -2.75, Math.PI / 2);  // garage side window

// ---------- driveway & path ----------
box(4.7, 0.06, 8.5, concreteM, 4.5, 0.03, 4.3);
box(1.6, 0.06, 5.5, pathM, -3, 0.03, 3.3);

// ---------- landscaping & props ----------
tree(-10, 3, 1.3); tree(10.5, -7, 1.1); tree(-9, -8, 0.9); tree(12, 4, 1.0);
bush(-5.3, 0.75, 0.9); bush(-4.1, 0.75, 0.75); bush(-1.9, 0.75, 0.8); bush(-0.7, 0.75, 0.95);
bush(2.1, 0.7, 0.7);
// mailbox
const post = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 1.3, 8), mat(0x5a4632));
post.position.set(7.6, 0.65, 7.6); post.castShadow = true; scene.add(post);
box(0.6, 0.38, 0.3, mat(0x33475e, { m: 0.5, r: 0.4 }), 7.6, 1.45, 7.6);

// ---------- day / night ----------
const DAY = { bg: 0xaee0f7, hemiI: 0.85, sunI: 2.2, sunC: 0xfff2dd, fog: 0xaee0f7 };
const NIGHT = { bg: 0x0b1026, hemiI: 0.22, sunI: 0.35, sunC: 0x8fa8ff, fog: 0x0b1026 };
let night = false;
scene.background = new THREE.Color(DAY.bg);
scene.fog = new THREE.Fog(DAY.fog, 45, 100);
function setNight(on) {
  night = on;
  const s = on ? NIGHT : DAY;
  scene.background.setHex(s.bg); scene.fog.color.setHex(s.fog);
  hemi.intensity = s.hemiI; sun.intensity = s.sunI; sun.color.setHex(s.sunC);
  glowWindows.forEach(g => {
    g.material.emissive.setHex(on ? 0xffb347 : 0x000000);
    g.material.emissiveIntensity = on ? 0.9 : 0;
  });
  porchLamp.material.emissive.setHex(on ? 0xffc27a : 0x000000);
  porchLight.intensity = on ? 6 : 0;
  document.getElementById('btnNight').textContent = on ? '☀️ Day' : '🌙 Night';
}

// ---------- UI ----------
const btnRotate = document.getElementById('btnRotate');
btnRotate.onclick = () => { controls.autoRotate = !controls.autoRotate; btnRotate.classList.toggle('on', controls.autoRotate); };
document.getElementById('btnNight').onclick = () => setNight(!night);
document.getElementById('btnReset').onclick = () => { camera.position.copy(HOME_POS); controls.target.copy(HOME_TGT); };

window.addEventListener('resize', () => {
  const w = container.clientWidth, h = container.clientHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h);
});

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
